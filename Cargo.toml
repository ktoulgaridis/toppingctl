[package]
name = "toppingctl"
version = "0.1.0"
edition = "2021"
description = "Control the TOPPING E2x2 USB audio interface over HID"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
crossterm = "0.29"
ratatui = "0.30"
# hidsniff's Ctrl-C: already in the tree (crossterm's resize signal).
signal-hook = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2", default-features = false, features = ["linux-native"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
hidapi = "2"
